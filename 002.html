<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鶴見礼子さん 報酬確認</title>
<style>
  :root {
    --bg: #f7f5f2; --card-bg: #ffffff; --ink: #2b2823; --ink-soft: #6b6459;
    --accent: #b8895a; --accent-soft: #f1e4d6; --line: #e7e1d8; --ok: #4c7a5e; --ok-bg: #e8f2ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17; --card-bg: #262320; --ink: #efeae2; --ink-soft: #a89f92;
      --accent: #d2a172; --accent-soft: #3a2f24; --line: #3a352e; --ok: #7fbf9c; --ok-bg: #1f3128;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --card-bg: #262320; --ink: #efeae2; --ink-soft: #a89f92;
    --accent: #d2a172; --accent-soft: #3a2f24; --line: #3a352e; --ok: #7fbf9c; --ok-bg: #1f3128;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    padding: 16px; padding-bottom: 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header.top { padding: 20px 4px 12px; }
  header.top h1 { font-size: 20px; margin: 0 0 4px; }
  header.top p { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card.pending { border-color: var(--accent); }
  .period-label { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .status-tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 8px; vertical-align: middle; }
  .status-tag.done { background: var(--ok-bg); color: var(--ok); }
  table.breakdown { width: 100%; border-collapse: collapse; font-size: 14px; margin: 10px 0 14px; }
  table.breakdown td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  table.breakdown td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  table.breakdown tr.total td { font-weight: 700; font-size: 16px; border-bottom: none; padding-top: 10px; }
  .btn { display: inline-block; width: 100%; text-align: center; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; box-sizing: border-box; }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-top: 8px; }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); margin-top: 8px; }
  .done-msg { color: var(--ok); font-size: 14px; font-weight: 600; padding: 10px 0 0; }
  .invoice { display: none; }
  .invoice.show { display: block; }
  .invoice-box { border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 12px; background: var(--bg); }
  .invoice-box h3 { margin: 0 0 10px; font-size: 16px; text-align: center; letter-spacing: 4px; }
  .invoice-box .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .invoice-box hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  .note { font-size: 12px; color: var(--ink-soft); margin-top: 10px; }
  footer { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 30px; }
  .loading { text-align: center; color: var(--ink-soft); padding: 30px 0; }
  .error-box { border: 1px solid #c0554a; background: #fbeae8; color: #7a2f27; border-radius: 10px; padding: 14px; font-size: 13px; }
  @media print {
    body * { visibility: hidden; }
    .invoice-box, .invoice-box * { visibility: visible; }
    .invoice-box { position: absolute; top: 0; left: 0; width: 100%; border: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>鶴見礼子 さん</h1>
    <p>Total Beauty Salon GLOW（イージー合同会社） 報酬内容の確認 / OK確認フォーム</p>
  </header>
  <div id="content" class="loading">読み込み中...</div>
  <footer>内容にご不明点があれば田村さんまでご連絡ください。</footer>
</div>

<script>
const STAFF_CODE = "002";
const STAFF_NAME = "鶴見礼子";
const BILL_TO = "Total Beauty Salon GLOW（イージー合同会社）";
const LIZ_EMAIL = "tamura@easyllc.jp";
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJKWtH3UfVER0DykPuigf9swabmxBsH89doF-PpeEgQNLKL29M1-7S_3MPM-yrQaa0K8ngnoUtoPdG/pub?output=csv";

function yen(n) { return "¥" + Number(n).toLocaleString("ja-JP"); }

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(",");
  return lines.slice(1).map(function(line) {
    const cols = line.split(",");
    const obj = {};
    headers.forEach(function(h, i) { obj[h.trim()] = (cols[i] || "").trim(); });
    return obj;
  });
}

function getKey(periodKey) { return "glow_invoice_ok_" + STAFF_CODE + "_" + periodKey; }

function markOk(periodKey) {
  try { localStorage.setItem(getKey(periodKey), "1"); } catch (e) {}
  render(window.__rows);
}

function printInvoice() { window.print(); }

function periodCardHtml(row) {
  const pk = row.period_key;
  const done = (function() { try { return localStorage.getItem(getKey(pk)) === "1"; } catch (e) { return false; } })();
  const invNo = row.invoice_no;
  const subj = "[請求書確認OK] " + STAFF_CODE + "_" + STAFF_NAME + "_" + row.month_label + "分";
  const body = "スタッフコード: " + STAFF_CODE + "\n氏名: " + STAFF_NAME + "\n対象月: " + row.month_label + "分\n報酬: " + yen(row.reward) + "\n交通費: " + yen(row.commute) + "\n合計: " + yen(row.total) + "\n請求書番号: " + invNo + "\n内容を確認しました。OKです。";
  const mailHref = "mailto:" + LIZ_EMAIL + "?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(body);
  const [y, m, d] = row.pay_date.split("/");
  const payDateJ = y + "年" + Number(m) + "月" + Number(d) + "日";

  let html = '<div class="card ' + (done ? '' : 'pending') + '">';
  html += '<p class="period-label">' + row.month_label + '分<span class="status-tag' + (done ? ' done' : '') + '">' + (done ? '確認済み' : '未確認') + '</span></p>';
  html += '<table class="breakdown">';
  html += '<tr><td>報酬</td><td>' + yen(row.reward) + '</td></tr>';
  html += '<tr><td>交通費</td><td>' + yen(row.commute) + '</td></tr>';
  html += '<tr class="total"><td>合計</td><td>' + yen(row.total) + '</td></tr>';
  html += '</table>';
  if (!done) {
    html += '<button class="btn" onclick="markOk(\'' + pk + '\')">内容を確認しました（OK）</button>';
  } else {
    html += '<p class="done-msg">確認ありがとうございます！下の「確認を送信する」を押すと完了です。請求書は自動で発行されます。</p>';
    html += '<div class="invoice show"><div class="invoice-box">';
    html += '<h3>請求書</h3>';
    html += '<div class="row"><span>請求書番号</span><span>' + invNo + '</span></div>';
    html += '<div class="row"><span>発行日</span><span>' + payDateJ + '</span></div>';
    html += '<div class="row"><span>請求先</span><span>' + BILL_TO + '</span></div>';
    html += '<div class="row"><span>請求元</span><span>' + STAFF_NAME + '</span></div>';
    html += '<hr>';
    html += '<div class="row"><span>' + row.month_label + '分 業務委託報酬</span><span>' + yen(row.reward) + '</span></div>';
    html += '<div class="row"><span>交通費</span><span>' + yen(row.commute) + '</span></div>';
    html += '<hr>';
    html += '<div class="row" style="font-weight:700; font-size:15px;"><span>ご請求金額（合計）</span><span>' + yen(row.total) + '</span></div>';
    html += '<p class="note">お振込先はご登録済みの口座情報の通りです。</p>';
    html += '</div>';
    html += '<a class="btn" href="' + mailHref + '">確認を送信する</a>';
    html += '<button class="btn secondary" onclick="printInvoice()">この内容を印刷 / 控えを保存</button>';
    html += '<p class="note">「確認を送信する」を押してメールアプリが開いたら、そのまま送信してください。自動で請求書が発行され、田村さん側で保管されます。</p>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function render(rows) {
  window.__rows = rows;
  const el = document.getElementById("content");
  if (!rows.length) {
    el.innerHTML = '<p>確認可能な対象期間がまだありません。</p>';
    return;
  }
  rows.sort(function(a, b) { return b.period_key.localeCompare(a.period_key); });
  el.innerHTML = rows.map(periodCardHtml).join("");
}

fetch(CSV_URL)
  .then(function(res) { if (!res.ok) throw new Error("fetch failed"); return res.text(); })
  .then(function(text) {
    const all = parseCsv(text);
    const rows = all.filter(function(r) { return String(Number(r.code)) === String(Number(STAFF_CODE)) && Number(r.total) > 0; });
    render(rows);
  })
  .catch(function(err) {
    document.getElementById("content").innerHTML = '<div class="error-box">データの読み込みに失敗しました。時間をおいて再読み込みしてください。うまくいかない場合は田村さんにご連絡ください。</div>';
  });
</script>
</body>
</html>
